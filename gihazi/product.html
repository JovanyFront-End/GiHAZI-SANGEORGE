﻿<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/logo/favicon.svg" />
  <title>تفاصيل الجهاز | جهازي</title>
  <meta name="description" content="تفاصيل ومواصفات الجهاز، أسعار الوكيل الرسمية، وفترة الضمان المعتمد مع خدمة التوصيل والتركيب في السويس." />
  <link href="/src/style.css" rel="stylesheet" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-blue-600 selection:text-white pt-16 sm:pt-20">

  <!-- Shared Navbar (injected by navbar.js) -->
  <div id="site-navbar"></div>

  <!-- Product Details Dynamic Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="product-details-container">
      <!-- Populated dynamically by productDetails.js -->
      <div class="py-20 text-center text-slate-400 text-sm">
        جاري تحميل تفاصيل الجهاز...
      </div>
    </div>

    <!-- Related Products Section -->
    <section class="mt-16 pt-12 border-t border-slate-200">
      <div class="flex items-center justify-between mb-8">
        <div>
          <span class="text-xs font-bold text-blue-600 block mb-1">اقتراحات مماثلة</span>
          <h2 class="text-xl sm:text-2xl font-black text-slate-900">أجهزة أخرى قد تهمك</h2>
        </div>
        <a href="/products.html" class="text-xs font-bold text-blue-600 hover:text-blue-800">
          تصفح المزيد &larr;
        </a>
      </div>

      <div id="related-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <div id="site-footer"></div>

  <script src="/src/js/main.js" type="module"></script>
</body>
</html>
