<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="160" fill="#f8fafc"/>

  <!-- TV Frame -->
  <rect x="60" y="100" width="280" height="170" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="64" y="104" width="272" height="162" rx="4" fill="url(#tvGrad)"/>

  <!-- Smart TV UI on screen -->
  <text x="200" y="170" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="bold" font-size="18" fill="#ffffff">TORNADO SMART</text>
  <rect x="140" y="185" width="120" height="20" rx="10" fill="#ffffff" fill-opacity="0.2"/>
  <text x="200" y="199" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" fill="#ffffff">YouTube • Shahid • Netflix</text>

  <!-- Feet / Stand (V-feet) -->
  <polygon points="90,270 110,270 80,310 70,310" fill="#334155"/>
  <polygon points="310,270 290,270 320,310 330,310" fill="#334155"/>

  <!-- Tornado brand badge -->
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="8" fill="#94a3b8">TORNADO</text>
</svg>
