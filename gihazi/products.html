<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>كتالوج الأجهزة المنزلية | جهازي </title>
  <meta name="description" content="تصفح أحدث الأجهزة المنزلية من بيكو وسامسونج في السويس. ثلاجات، غسالات، شاشات، وأفران بأفضل الأسعار مع ضمان رسمي وتوصيل فوري." />
  <link href="/src/style.css" rel="stylesheet" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-blue-600 selection:text-white pt-16 sm:pt-20">

  <!-- Shared Navbar (injected by navbar.js) -->
  <div id="site-navbar"></div>

  <!-- Catalog Page Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Breadcrumb -->
    <nav class="flex items-center gap-2 text-xs text-slate-500 mb-4" aria-label="مسار التنقل">
      <a href="/" class="hover:text-blue-600">الرئيسية</a>
      <span>/</span>
      <span class="text-slate-800 font-semibold">كتالوج الأجهزة</span>
    </nav>

    <!-- Page Header & Sorting Controls -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-200/80 mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900">كتالوج الأجهزة المنزلية</h1>
        <p class="text-xs text-slate-500 mt-1">منتجات أصلية بضمان الوكيل المعتمد في السويس — توصيل وتركيب فوري</p>
      </div>

      <div class="flex items-center gap-3 self-end md:self-auto">
        <span id="products-count-badge" class="text-xs font-bold text-slate-600 bg-white px-3 py-1.5 rounded-xl border border-slate-200">
          جاري التحميل...
        </span>

        <!-- Sort Select -->
        <select id="catalog-sort-select" class="text-xs font-bold bg-white border border-slate-200 rounded-xl px-3 py-2 text-slate-700 focus:outline-none focus:ring-1 focus:ring-blue-500">
          <option value="featured">الترتيب: المميز أولاً</option>
          <option value="price-asc">السعر: من الأقل للأعلى</option>
          <option value="price-desc">السعر: من الأعلى للأقل</option>
          <option value="rating">الأعلى تقييماً</option>
          <option value="reviews">الأكثر طلباً</option>
        </select>
      </div>
    </div>

    <!-- Active Filters Chips Bar -->
    <div id="active-filters-chips" class="hidden mb-6"></div>

    <!-- Catalog Layout Grid: Sidebar + Products Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Filter Sidebar Column -->
      <aside class="lg:col-span-3 bg-white rounded-2xl border border-slate-200/80 shadow-xs p-5 space-y-6">
        
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <h2 class="text-sm font-bold text-slate-900 flex items-center gap-2">
            <span>⚙️</span>
            <span>تصفية الأجهزة</span>
          </h2>
          <button id="btn-reset-filters" type="button" class="text-[11px] font-bold text-blue-600 hover:text-blue-800">
            إعادة تعيين
          </button>
        </div>

        <!-- Category Filter -->
        <div>
          <h3 class="text-xs font-bold text-slate-800 mb-2">الأقسام</h3>
          <div id="filter-categories-list" class="space-y-1">
            <!-- Populated dynamically by filters.js -->
          </div>
        </div>

        <!-- Brand Filter -->
        <div class="pt-4 border-t border-slate-100">
          <h3 class="text-xs font-bold text-slate-800 mb-2">الماركات</h3>
          <div id="filter-brands-list" class="space-y-1">
            <!-- Populated dynamically by filters.js -->
          </div>
        </div>

        <!-- Price Range Filter -->
        <div class="pt-4 border-t border-slate-100">
          <h3 class="text-xs font-bold text-slate-800 mb-2">نطاق السعر (ج.م)</h3>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <input type="number" id="filter-min-price" placeholder="من" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:ring-1 focus:ring-blue-500" />
            <input type="number" id="filter-max-price" placeholder="إلى" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:ring-1 focus:ring-blue-500" />
          </div>
          <button id="filter-apply-price" type="button" class="w-full mt-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-1.5 rounded-lg text-xs transition-colors">
            تطبيق السعر
          </button>
        </div>

        <!-- Stock Availability Filter -->
        <div class="pt-4 border-t border-slate-100">
          <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
            <input type="checkbox" id="filter-instock-only" class="accent-blue-600 w-4 h-4 rounded" />
            <span>عرض الأجهزة المتوفرة فقط</span>
          </label>
        </div>

      </aside>

      <!-- Products Grid Column -->
      <section class="lg:col-span-9">
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Populated dynamically by filters.js via productCards.js -->
        </div>
      </section>

    </div>

  </main>

  <!-- Footer -->
  <div id="site-footer"></div>


  <script src="/src/js/main.js" type="module"></script>
</body>
</html>
